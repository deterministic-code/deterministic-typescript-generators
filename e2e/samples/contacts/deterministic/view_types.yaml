version: 1.0.0
includes:
  - datasource_types:
      include: "*"
      auto_enrich: true

types:
  # Composite — contact with its addresses and phones.
  - contact:
      inherits: datasource_types.contact
      fields:
        - addresses:
            type: datasource_types.address[]
            references: datasource_types.address.contact_id
        - phones:
            type: datasource_types.phone[]
            references: datasource_types.phone.contact_id

  # Composite — group with its member contacts (M2M).
  - contact_group:
      inherits: datasource_types.contact_group
      fields:
        - members:
            type: datasource_types.contact[]
            references: datasource_types.contact_group_member.contact_group_id

  # Request shape for ContactImportService.
  - import_contacts_request:
      fields:
        - source:
            type: string
            size: 64
        - payload:
            type: string
            size: unlimited

  - import_contacts_result:
      fields:
        - imported_count:
            type: number
        - skipped_count:
            type: number
        - failed_count:
            type: number

  # Response shape for LegacyMigrationService.
  - legacy_migration_result:
      fields:
        - migrated_count:
            type: number
        - skipped_count:
            type: number
        - completed_at:
            type: datetime
            is_nullable: true
